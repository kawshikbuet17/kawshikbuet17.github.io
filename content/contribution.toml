[[sections.items]]
title = "Two-Phase Hybrid Asynchronous Inspection (THAI): A Latency-Agnostic Framework for Intelligent Malicious HTTP Request Detection using Large Language Models"
subtitle = "Preprint Article"
date = "2026"
content = """
Architectural framework for intelligent malicious HTTP request detection using LLMs with two-phase mechanism (deterministic pre-filtering + async LLM confirmation). Multi-request batching reduces LLM overhead by 90%+ while eliminating 98% of false positives.

**Topics:** Cybersecurity, LLM, HTTP Security, Machine Learning

**Links:** [SSRN](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6730801)
"""
tags = ["Cybersecurity", "LLM", "Web Security", "Article"]

